server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;
    # Redirects stay relative so they keep the public scheme and host behind the proxy.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain application/wasm application/java-archive;

    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";

        # Workers inherit nothing from the patcher page: their scripts must opt in to isolation too.
        location /_app/immutable/workers/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Cross-Origin-Opener-Policy "same-origin";
            add_header Cross-Origin-Embedder-Policy "require-corp";
        }
    }

    # Content-addressed patch engine and Java runtime, copied from @reseam/browser.
    location /runtime/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SharedArrayBuffer needs a cross-origin isolated page.
    location /patch/ {
        add_header Cross-Origin-Opener-Policy "same-origin";
        add_header Cross-Origin-Embedder-Policy "require-corp";
        try_files $uri $uri/index.html $uri.html =404;
    }

    # A folder without its trailing slash redirects, so /patch reaches the isolated /patch/.
    location / {
        try_files $uri $uri/ =404;
    }

    location = /404.html {
        internal;
    }

    error_page 404 /404.html;
}
